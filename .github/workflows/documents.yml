name: documents

# The document engines' library (native/documents) for each platform, by hand only: left as this run's artifacts, which
# whoever runs it uploads to a documents-<version> prerelease and pins the hashes of in DocumentEnginesLocator.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build — ${{ matrix.name }}
    # A build takes 6-20 minutes; a stuck one stops here, not at GitHub's 6 hours.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, builds: "linux-x64:x86_64-unknown-linux-gnu", library: libkarvon_documents.so }
          - { name: win-x64, os: windows-latest, builds: "win-x64:x86_64-pc-windows-msvc", library: karvon_documents.dll }
          # Both Macs on one runner, in one cargo run that builds their build scripts and macros once: macOS minutes
          # cost the most.
          - { name: osx, os: macos-latest, builds: "osx-arm64:aarch64-apple-darwin osx-x64:x86_64-apple-darwin", library: libkarvon_documents.dylib }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: native/documents
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: |
          rustup update stable
          rustup default stable
          for build in ${{ matrix.builds }}; do rustup target add "${build#*:}"; done

      - name: Version
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: cargo build --release --locked $(for build in ${{ matrix.builds }}; do echo "--target ${build#*:}"; done)

      - name: Package
        run: |
          for build in ${{ matrix.builds }}; do
            ${{ runner.os == 'Windows' && 'python' || 'python3' }} package.py "target/${build#*:}/release/${{ matrix.library }}" "$VERSION" "${build%%:*}" packages
          done

      - uses: actions/upload-artifact@v4
        with:
          name: karvon-documents-${{ matrix.name }}
          path: native/documents/packages/*
          if-no-files-found: error
