name: CI

# Documentation, screenshots and the Visual Studio extension (built by vsix.yml) do not touch the Linux build.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'src/Karvon.VisualStudio/**', '.github/workflows/vsix.yml', '.github/workflows/release.yml', '.github/workflows/platforms.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'src/Karvon.VisualStudio/**', '.github/workflows/vsix.yml', '.github/workflows/release.yml', '.github/workflows/platforms.yml']

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # The Database Explorer's engine (bengine) is a submodule.
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # jdtls runs on Java 21 or newer: the runner's default is older.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Delve takes the last Go versions only: the runner's own Go may be older.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Restore
        run: dotnet restore Karvon.slnx

      - name: Build
        run: dotnet build Karvon.slnx -c Release --no-restore

      # Unit tests plus the headless UI tests of the main window; the integration tests restore and build a
      # sample Blazor solution, install roslyn-language-server and netcoredbg, and drive a fake Claude Code CLI.
      # Normally ~3 min. Each test is listed as it finishes, and one that hangs for 5 minutes is named and the run fails.
      - name: Test
        timeout-minutes: 15
        env:
          # TypeScript 7, js-debug, Vitest and Jest from the npm registry and GitHub (a few seconds each).
          KARVON_TYPESCRIPT_LIVE: "1"
          # Pyright from the npm registry and debugpy from PyPI, its language server and its debugger.
          KARVON_PYTHON_LIVE: "1"
          # gopls and Delve built with the runner's Go (go install), go test in Test Explorer.
          KARVON_GO_LIVE: "1"
          # rust-analyzer and CodeLLDB from their GitHub releases, with the runner's cargo.
          KARVON_RUST_LIVE: "1"
          # clangd from its GitHub release, with the runner's CMake and gcc.
          KARVON_CPP_LIVE: "1"
          # jdtls from Eclipse and java-debug from Open VSX, on the runner's JDK.
          KARVON_JAVA_LIVE: "1"
          # The test process crashes now and then (SIGSEGV, exit code 139): the runtime writes a mini dump (the threads'
          # stacks, no heap) of the process that crashes, kept below when the run fails.
          DOTNET_DbgEnableMiniDump: "1"
          DOTNET_DbgMiniDumpType: "1"
          DOTNET_DbgMiniDumpName: ${{ runner.temp }}/dumps/karvon-%p-%t.dmp
        run: |
          mkdir -p "$RUNNER_TEMP/dumps"
          dotnet test Karvon.slnx -c Release --no-build --blame-hang-timeout 5m --blame-hang-dump-type none --logger "console;verbosity=normal"

      - name: Keep the crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore
          retention-days: 3
